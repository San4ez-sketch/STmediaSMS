<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>STmedia Messenger</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background: var(--bg-dark); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* ЭКРАН АВТОРИЗАЦИИ */
    .auth-overlay {
      position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
      background: var(--card-bg); width: 100%; max-width: 360px; padding: 24px; border-radius: 16px;
      border: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; text-align: center;
    }
    .auth-card h2 { font-size: 22px; color: var(--accent); }
    .auth-card input {
      width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border);
      color: white; border-radius: 10px; font-size: 15px; outline: none;
    }

    /* ОСНОВНОЙ ИНТЕРФЕЙС */
    .app-header { background: var(--card-bg); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; }
    .logo-box { width: 34px; height: 34px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    
    .id-badge { font-size: 11px; background: var(--bg-dark); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 6px; }

    .main-content { flex: 1; position: relative; overflow: hidden; }
    .tab { display: none; height: 100%; width: 100%; position: absolute; inset: 0; }
    .tab.active { display: flex; flex-direction: column; }

    /* СЕТКА ЧАТОВ */
    .chat-container { display: flex; width: 100%; height: 100%; position: relative; }
    
    .contacts-pane { width: 100%; background: var(--bg-dark); display: flex; flex-direction: column; height: 100%; border-right: 1px solid var(--border); }
    .contacts-header { padding: 12px 16px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
    
    .contacts-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .contact-item {
      padding: 10px 12px; background: var(--card-bg); border-radius: 12px; cursor: pointer;
      border: 1px solid transparent; display: flex; align-items: center; gap: 12px; transition: 0.2s; user-select: none;
    }
    .contact-item:active { background: #26334d; }
    .contact-item.active { border-color: var(--accent); background: #1e3a34; }
    
    .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--border); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; flex-shrink: 0; }

    /* ОКНО ЧАТА */
    .chat-pane { width: 100%; background: var(--bg-dark); display: flex; flex-direction: column; height: 100%; position: absolute; inset: 0; z-index: 20; }
    .chat-pane.hidden-mobile { display: none; }
    
    .chat-header { padding: 10px 14px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .chat-user-info { display: flex; align-items: center; gap: 10px; }
    
    .messages-area { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 14px; max-width: 82%; font-size: 14.5px; word-break: break-word; line-height: 1.4; }
    .msg.in { background: var(--card-bg); align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.out { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg audio { max-width: 200px; margin-top: 4px; border-radius: 8px; }

    .input-bar { padding: 10px; display: flex; gap: 8px; border-top: 1px solid var(--border); background: var(--card-bg); align-items: center; }
    .input-bar input { flex: 1; padding: 10px 14px; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 20px; font-size: 15px; outline: none; }
    
    /* КНОПКИ */
    .btn { padding: 10px 16px; background: var(--accent); border: none; color: white; font-weight: 600; border-radius: 10px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background: var(--border); }
    .btn-danger { background: #ef4444; }
    .btn-circle { width: 40px; height: 40px; border-radius: 50%; padding: 0; flex-shrink: 0; }

    /* НИЖНЯЯ НАВИГАЦИЯ */
    .bottom-nav { background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; padding-bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 10; }
    .nav-btn { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; flex: 1; cursor: pointer; }
    .nav-btn.active { color: var(--accent); font-weight: bold; }
    .nav-btn .icon { font-size: 20px; }

    /* FLASH & ПРОФИЛЬ */
    .profile-pane, .flash-pane { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .flash-feed { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .flash-card { width: 100%; max-width: 340px; height: 480px; background: black; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
    .flash-card video { width: 100%; height: 100%; object-fit: cover; }

    /* Звонки */
    .call-window { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 10000; }
    video.peer-video { width: 280px; height: 200px; background: #000; border-radius: 14px; object-fit: cover; border: 2px solid var(--border); }

    /* Десктоп адаптация */
    @media (min-width: 769px) {
      .contacts-pane { width: 320px; }
      .chat-pane { position: relative; width: auto; flex: 1; display: flex !important; z-index: 1; }
      .btn-back { display: none; }
    }
  </style>
</head>
<body>

  <!-- Окно авторизации -->
  <div class="auth-overlay" id="authScreen">
    <div class="auth-card">
      <h2>Вход в STmedia</h2>
      <p style="font-size: 12px; color: var(--text-sub);">Введите Логин и Пароль. ID привязан к ним навсегда.</p>
      <input type="text" id="authLogin" placeholder="Логин">
      <input type="password" id="authPass" placeholder="Пароль">
      <button class="btn" onclick="performAuth()">Войти / Зарегистрироваться</button>
    </div>
  </div>

  <!-- Верхняя панель -->
  <div class="app-header">
    <div class="logo">
      <div class="logo-box">ST</div>
      <span>STmedia</span>
    </div>
    <div class="id-badge" onclick="copyMyId()">
      <span>ID: <b id="myPeerId" style="color:var(--accent);">...</b></span>
      <span>📋</span>
    </div>
  </div>

  <!-- Контент страниц -->
  <div class="main-content">
    
    <!-- Вкладка Чаты -->
    <div id="chats" class="tab active">
      <div class="chat-container">
        
        <!-- Список контактов -->
        <div class="contacts-pane" id="contactsPane">
          <div class="contacts-header">
            <button class="btn" style="width: 100%;" onclick="addContact()">➕ Добавить контакт</button>
          </div>
          <div class="contacts-list" id="contactsList"></div>
        </div>

        <!-- Чат панель -->
        <div class="chat-pane hidden-mobile" id="chatPane">
          <div class="chat-header">
            <div class="chat-user-info">
              <button class="btn btn-secondary btn-back" onclick="closeChatMobile()">⬅</button>
              <div class="avatar" id="chatAvatar">?</div>
              <div>
                <b id="activeContactName" style="font-size: 15px;">Выберите контакт</b>
                <div id="activeContactStatus" style="font-size: 11px; color: var(--accent);">онлайн</div>
              </div>
            </div>
            <div style="display: flex; gap: 6px;">
              <button class="btn btn-secondary" onclick="startCall(false)">📞</button>
              <button class="btn btn-secondary" onclick="startCall(true)">📹</button>
            </div>
          </div>

          <div class="messages-area" id="msgArea">
            <div class="msg in">Выберите контакт из списка слева для начала общения.</div>
          </div>

          <div class="input-bar">
            <button class="btn btn-secondary btn-circle" id="voiceBtn" title="Голосовое сообщение">🎙️</button>
            <input type="text" id="msgInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="btn" onclick="sendMsg()">Отправить</button>
          </div>
        </div>

      </div>
    </div>

    <!-- Вкладка Flash -->
    <div id="flash" class="tab">
      <div class="flash-pane">
        <div style="display: flex; gap: 8px;">
          <input type="text" id="flashUrlInput" placeholder="Ссылка на MP4 видео..." style="flex:1; padding:10px; background:var(--card-bg); border:1px solid var(--border); color:white; border-radius:10px;">
          <button class="btn" onclick="addFlash()">Опубликовать</button>
        </div>
        <div class="flash-feed" id="flashFeed"></div>
      </div>
    </div>

    <!-- Вкладка Профиль -->
    <div id="profile" class="tab">
      <div class="profile-pane">
        <h3 style="color: var(--accent);">Мой Профиль</h3>
        
        <div style="display: flex; align-items: center; gap: 16px;">
          <img id="myAvatarImg" class="avatar" style="width: 64px; height: 64px;" src="" alt="Avatar">
          <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(this)">
          <button class="btn btn-secondary" onclick="document.getElementById('avatarFileInput').click()">Сменить аватарку</button>
        </div>

        <label style="font-size: 12px; color: var(--text-sub);">Имя профиля:</label>
        <input type="text" id="inputNick" style="padding:10px; background:var(--card-bg); border:1px solid var(--border); color:white; border-radius:10px;">

        <button class="btn" onclick="saveProfile()">Сохранить изменения</button>
        <button class="btn btn-danger" style="margin-top: 20px;" onclick="logout()">Выйти из аккаунта</button>
      </div>
    </div>

  </div>

  <!-- Нижнее меню -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-chats" onclick="switchTab('chats')">
      <span class="icon">💬</span>
      <span>Чаты</span>
    </button>
    <button class="nav-btn" id="nav-flash" onclick="switchTab('flash')">
      <span class="icon">⚡</span>
      <span>Flash</span>
    </button>
    <button class="nav-btn" id="nav-profile" onclick="switchTab('profile')">
      <span class="icon">👤</span>
      <span>Профиль</span>
    </button>
  </div>

  <!-- Звонки -->
  <div class="call-window" id="callWin">
    <h3 id="callTypeTitle">Вызов...</h3>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
      <video id="localVid" class="peer-video" autoplay playsinline muted></video>
      <video id="remoteVid" class="peer-video" autoplay playsinline></video>
    </div>
    <button class="btn btn-danger" style="padding: 12px 24px;" onclick="endCall()">Завершить звонок</button>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let myPeerId = null;
    let selectedPeerId = null;
    let mediaRecorder = null;
    let audioChunks = [];

    let contacts = [];
    let chatsHistory = {};
    let myProfile = { nick: "Пользователь", avatar: "" };

    async function generateStaticId(login, password) {
      const text = `stmedia_salt_${login.trim().toLowerCase()}_${password}`;
      const msgUint8 = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return 'st_' + hashHex.substring(0, 10);
    }

    async function performAuth() {
      const login = document.getElementById('authLogin').value;
      const pass = document.getElementById('authPass').value;
      if (!login || !pass) return alert('Введите логин и пароль!');

      myPeerId = await generateStaticId(login, pass);
      localStorage.setItem('st_auth_id', myPeerId);

      document.getElementById('authScreen').style.display = 'none';
      initApp();
    }

    function initApp() {
      loadData();
      document.getElementById('myPeerId').innerText = myPeerId;
      document.getElementById('inputNick').value = myProfile.nick;
      updateAvatarDisplay();

      // Усиленное P2P подключение
      peer = new Peer(myPeerId, {
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
          ]
        }
      });

      peer.on('open', (id) => {
        console.log('Подключено к серверу, мой ID:', id);
      });

      peer.on('connection', (c) => {
        conn = c;
        bindConnectionEvents();
      });

      peer.on('call', handleIncomingCall);

      renderContacts();
      setupVoiceRecording();
    }

    function loadData() {
      const prefix = myPeerId + '_';
      contacts = JSON.parse(localStorage.getItem(prefix + 'contacts') || '[]');
      chatsHistory = JSON.parse(localStorage.getItem(prefix + 'chats') || '{}');
      myProfile = JSON.parse(localStorage.getItem(prefix + 'profile') || '{"nick":"Пользователь","avatar":""}');
    }

    function saveData() {
      const prefix = myPeerId + '_';
      localStorage.setItem(prefix + 'contacts', JSON.stringify(contacts));
      localStorage.setItem(prefix + 'chats', JSON.stringify(chatsHistory));
      localStorage.setItem(prefix + 'profile', JSON.stringify(myProfile));
    }

    function logout() {
      if (confirm('Вы уверены, что хотите выйти?')) {
        localStorage.removeItem('st_auth_id');
        location.reload();
      }
    }

    function bindConnectionEvents() {
      if (!conn) return;
      conn.on('data', (data) => {
        if (data.type === 'msg' || data.type === 'voice') {
          saveIncomingMsg(data.senderId, data);
          if (selectedPeerId === data.senderId) {
            renderMessages();
          }
        }
      });
    }

    function selectContact(contact) {
      selectedPeerId = contact.peerId;
      document.getElementById('activeContactName').innerText = contact.name;
      
      const avatarEl = document.getElementById('chatAvatar');
      if (contact.avatar) {
        avatarEl.innerHTML = `<img src="${contact.avatar}" class="avatar">`;
      } else {
        avatarEl.innerText = contact.name[0].toUpperCase();
      }

      // Переключаем экран чата на мобильном
      document.getElementById('chatPane').classList.remove('hidden-mobile');

      // Создаем соединение
      try {
        conn = peer.connect(selectedPeerId, { reliable: true });
        bindConnectionEvents();
      } catch (e) {
        console.log("Ошибка подключения:", e);
      }

      renderContacts();
      renderMessages();
    }

    function closeChatMobile() {
      document.getElementById('chatPane').classList.add('hidden-mobile');
    }

    function sendMsg(audioBlobUrl = null) {
      const input = document.getElementById('msgInput');
      const text = input ? input.value.trim() : "";
      
      if (!text && !audioBlobUrl) return;

      const msgObj = {
        type: audioBlobUrl ? 'voice' : 'msg',
        text: text,
        audio: audioBlobUrl,
        senderId: myPeerId,
        timestamp: Date.now()
      };

      if (!chatsHistory[selectedPeerId]) chatsHistory[selectedPeerId] = [];
      chatsHistory[selectedPeerId].push(msgObj);
      saveData();

      if (conn && conn.open) {
        conn.send(msgObj);
      } else if (selectedPeerId) {
        conn = peer.connect(selectedPeerId, { reliable: true });
        conn.on('open', () => conn.send(msgObj));
        bindConnectionEvents();
      }

      if (input) input.value = '';
      renderMessages();
    }

    function saveIncomingMsg(senderId, msgObj) {
      if (!chatsHistory[senderId]) chatsHistory[senderId] = [];
      chatsHistory[senderId].push(msgObj);
      saveData();
    }

    function renderMessages() {
      const area = document.getElementById('msgArea');
      area.innerHTML = '';
      
      const msgs = chatsHistory[selectedPeerId] || [];
      if (msgs.length === 0) {
        area.innerHTML = '<div class="msg in">Сообщений пока нет. Напишите первым!</div>';
        return;
      }

      msgs.forEach(m => {
        const div = document.createElement('div');
        const isOut = m.senderId === myPeerId;
        div.className = `msg ${isOut ? 'out' : 'in'}`;
        
        if (m.type === 'voice') {
          div.innerHTML = `🎙️ Голосовое сообщение<br><audio src="${m.audio}" controls></audio>`;
        } else {
          div.innerText = m.text;
        }
        area.appendChild(div);
      });
      area.scrollTop = area.scrollHeight;
    }

    function setupVoiceRecording() {
      const btn = document.getElementById('voiceBtn');
      
      const startRec = async (e) => {
        e.preventDefault();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
              if (selectedPeerId) sendMsg(reader.result);
            };
          };
          mediaRecorder.start();
          btn.style.background = '#ef4444';
        } catch (err) {
          alert('Доступ к микрофону не предоставлен');
        }
      };

      const stopRec = (e) => {
        e.preventDefault();
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          btn.style.background = 'var(--border)';
        }
      };

      btn.addEventListener('touchstart', startRec);
      btn.addEventListener('touchend', stopRec);
      btn.addEventListener('mousedown', startRec);
      btn.addEventListener('mouseup', stopRec);
    }

    function addContact() {
      const name = prompt('Имя контакта:');
      if (!name) return;
      let peerId = prompt('ID контакта:');
      if (!peerId) return;

      peerId = peerId.trim();
      if (!peerId.startsWith('st_')) {
        peerId = 'st_' + peerId;
      }

      contacts.push({ name, peerId, avatar: "" });
      saveData();
      renderContacts();
    }

    function renderContacts() {
      const list = document.getElementById('contactsList');
      list.innerHTML = '';
      if (contacts.length === 0) {
        list.innerHTML = '<div style="font-size:12px; color:var(--text-sub); text-align:center; padding:20px;">Список контактов пуст</div>';
        return;
      }
      contacts.forEach(c => {
        const item = document.createElement('div');
        item.className = 'contact-item' + (selectedPeerId === c.peerId ? ' active' : '');
        
        const avatarHtml = c.avatar 
          ? `<img src="${c.avatar}" class="avatar">` 
          : `<div class="avatar">${c.name[0].toUpperCase()}</div>`;

        item.innerHTML = `${avatarHtml}<div><b>${c.name}</b><div style="font-size:11px; color:var(--text-sub);">${c.peerId}</div></div>`;
        item.onclick = () => selectContact(c);
        list.appendChild(item);
      });
    }

    function handleAvatarUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          myProfile.avatar = e.target.result;
          updateAvatarDisplay();
          saveData();
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function updateAvatarDisplay() {
      const img = document.getElementById('myAvatarImg');
      if (myProfile.avatar) {
        img.src = myProfile.avatar;
      } else {
        img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="%23334155"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="24">👤</text></svg>';
      }
    }

    function saveProfile() {
      myProfile.nick = document.getElementById('inputNick').value;
      saveData();
      alert('Профиль сохранен!');
    }

    function switchTab(id) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('nav-' + id).classList.add('active');
    }

    function copyMyId() {
      navigator.clipboard.writeText(myPeerId);
      alert('Ваш ID скопирован: ' + myPeerId);
    }

    function startCall(enableVideo) {
      if (!selectedPeerId) return alert('Выберите контакт!');
      navigator.mediaDevices.getUserMedia({ video: enableVideo, audio: true }).then((stream) => {
        document.getElementById('localVid').srcObject = stream;
        document.getElementById('callWin').style.display = 'flex';
        const call = peer.call(selectedPeerId, stream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remoteVid').srcObject = remoteStream;
        });
      });
    }

    function handleIncomingCall(call) {
      const withVideo = confirm('Входящий вызов! Включить видео?');
      navigator.mediaDevices.getUserMedia({ video: withVideo, audio: true }).then((stream) => {
        document.getElementById('localVid').srcObject = stream;
        document.getElementById('callWin').style.display = 'flex';
        call.answer(stream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remoteVid').srcObject = remoteStream;
        });
      });
    }

    function endCall() {
      document.getElementById('callWin').style.display = 'none';
      location.reload();
    }

    function addFlash() {
      const url = document.getElementById('flashUrlInput').value;
      if (!url) return;
      const feed = document.getElementById('flashFeed');
      const card = document.createElement('div');
      card.className = 'flash-card';
      card.innerHTML = `<video src="${url}" controls playsinline loop></video>`;
      feed.prepend(card);
      document.getElementById('flashUrlInput').value = '';
    }

    const savedAuthId = localStorage.getItem('st_auth_id');
    if (savedAuthId) {
      myPeerId = savedAuthId;
      document.getElementById('authScreen').style.display = 'none';
      initApp();
    }
  </script>
</body>
</html>
